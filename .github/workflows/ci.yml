name: CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build pytest mypy

      # Type checking first
      - name: Run mypy type checks
        run: mypy --strict src/kesslergame/kessler_game.py

      # Build a mypyc compiled wheel so tests run faster
      - name: Build wheel
        env:
          USE_MYPYC: "1"
        run: python -m build

      - name: Install wheel
        run: pip install dist/*.whl

      # Unit tests
      - name: Run pytest unit tests
        run: pytest tests/pytest

      # Integration tests. Run each with appropriate arguments.
      - name: Run integration game scripts
        run: |
          python tests/test_competition_safe_mode_equivalence_and_speed.py --nogui -trials 12
          python tests/test_conservation_of_asteroids.py --nogui -trials 80
          python tests/test_controller_exceptions.py --nogui -trials 600
          python tests/test_framerate_independence.py --nogui -trials 1000

      - name: Check logs are empty
        run: |
          shopt -s nullglob
          files=(*.log)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No log files found in current working directory!"
            exit 1
          fi
          for logfile in "${files[@]}"; do
            echo "Checking $logfile"
            if [ -s "$logfile" ]; then
              echo "ERROR: Log file $logfile is not empty!"
              cat "$logfile"
              exit 1
            fi
          done
